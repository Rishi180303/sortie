[project]
name = "sortie"
version = "0.1.0"
description = "Emails you when films on your Letterboxd watchlist get showtimes near you."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "curl_cffi>=0.7",
  "beautifulsoup4>=4.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
sortie = "sortie.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sortie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:sortie.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
