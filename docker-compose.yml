services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sortie
      POSTGRES_PASSWORD: sortie
      POSTGRES_DB: sortie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
