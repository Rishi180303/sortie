name: preflight
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/preflight.yml']

jobs:
  connectivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync

      - name: report the client library versions
        if: always()
        run: |
          uv run python -c "
          import psycopg
          print('psycopg', psycopg.__version__)
          print('libpq', psycopg.pq.version(), 'impl', psycopg.pq.__impl__)
          "

      - name: DNS resolves the database host
        if: always()
        run: |
          uv run python -c "
          import os, socket, urllib.parse as up
          h = up.urlparse(os.environ['U'].replace('postgresql+psycopg://','postgresql://',1)).hostname
          print('host:', h)
          for fam, _, _, _, sa in socket.getaddrinfo(h, 5432, proto=socket.IPPROTO_TCP):
              print(' ', fam.name, sa[0])
          "
        env: { U: "${{ secrets.DATABASE_URL }}" }

      - name: TCP reaches port 5432
        if: always()
        run: |
          uv run python -c "
          import os, socket, urllib.parse as up
          h = up.urlparse(os.environ['U'].replace('postgresql+psycopg://','postgresql://',1)).hostname
          s = socket.create_connection((h, 5432), timeout=25); s.close(); print('tcp ok')
          "
        env: { U: "${{ secrets.DATABASE_URL }}" }

      - name: connects with channel binding dropped
        if: always()
        run: |
          uv run python -c "
          import os, re, psycopg
          u = os.environ['U'].replace('postgresql+psycopg://','postgresql://',1)
          u = re.sub(r'[?&]channel_binding=require', lambda m: '?' if m.group(0)[0]=='?' else '', u).replace('?&','?').rstrip('?&')
          with psycopg.connect(u, connect_timeout=25) as c:
              print('films:', c.execute('select count(*) from film').fetchone()[0])
          "
        env: { U: "${{ secrets.DATABASE_URL }}" }

      - name: connects exactly as the secret is written
        if: always()
        run: |
          uv run python -c "
          import os, psycopg
          u = os.environ['U'].replace('postgresql+psycopg://','postgresql://',1)
          with psycopg.connect(u, connect_timeout=25) as c:
              print('films:', c.execute('select count(*) from film').fetchone()[0])
          "
        env: { U: "${{ secrets.DATABASE_URL }}" }

      - name: connects through sqlalchemy as the app does
        if: always()
        run: |
          uv run python -c "
          from sqlalchemy import text
          from sortie.config import load_secrets
          from sortie.db import make_engine
          with make_engine(load_secrets().database_url).connect() as c:
              print('films:', c.execute(text('select count(*) from film')).scalar())
          "
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          TMDB_API_KEY: "${{ secrets.TMDB_API_KEY }}"
