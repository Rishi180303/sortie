name: preflight2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/preflight.yml']

jobs:
  connectivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - name: diagnose reachability and report as annotations
        run: |
          uv run python - <<'PY'
          import os, socket, time, urllib.parse as up

          def note(msg):
              print(f"::error::{msg}")

          url = os.environ["U"].replace("postgresql+psycopg://", "postgresql://", 1)
          p = up.urlparse(url)
          host, port = p.hostname, p.port or 5432
          note(f"host={host} port={port}")

          try:
              infos = socket.getaddrinfo(host, port, proto=socket.IPPROTO_TCP)
              note("dns=" + " | ".join(f"{i[0].name}:{i[4][0]}" for i in infos))
          except Exception as e:
              note(f"dns FAILED {type(e).__name__}: {e}")
              infos = []

          for fam, _, _, _, sa in infos:
              t = time.time()
              s = socket.socket(fam, socket.SOCK_STREAM)
              s.settimeout(15)
              try:
                  s.connect(sa[:2] if fam == socket.AF_INET else sa)
                  note(f"tcp {sa[0]} OK in {time.time()-t:.1f}s")
              except Exception as e:
                  note(f"tcp {sa[0]} FAILED after {time.time()-t:.1f}s {type(e).__name__}: {e}")
              finally:
                  s.close()

          # can this runner reach anything on 5432 at all, and the wider internet?
          for probe_host, probe_port, label in [
              ("api.themoviedb.org", 443, "tmdb:443"),
              ("www.fandango.com", 443, "fandango:443"),
              (host, 443, "neonhost:443"),
          ]:
              t = time.time()
              try:
                  socket.create_connection((probe_host, probe_port), timeout=15).close()
                  note(f"{label} OK in {time.time()-t:.1f}s")
              except Exception as e:
                  note(f"{label} FAILED {type(e).__name__}: {e}")

          try:
              import psycopg
              t = time.time()
              with psycopg.connect(url, connect_timeout=20) as c:
                  n = c.execute("select count(*) from film").fetchone()[0]
              note(f"psycopg OK in {time.time()-t:.1f}s films={n}")
          except Exception as e:
              note(f"psycopg FAILED {type(e).__name__}: {str(e)[:300]}")
          PY
        env: { U: "${{ secrets.DATABASE_URL }}" }
