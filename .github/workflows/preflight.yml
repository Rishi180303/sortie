name: preflight3
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/preflight.yml']

jobs:
  connectivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - name: query neon the way the app does
        run: |
          uv run python - <<'PY'
          import time
          from sqlalchemy import text
          from sortie.config import load_secrets
          from sortie.db import make_engine, make_session_factory

          def note(m):
              print(f"::error::{m}")

          try:
              eng = make_engine(load_secrets().database_url)
              t = time.time()
              with eng.connect() as c:
                  films = c.execute(text("select count(*) from film")).scalar()
                  showings = c.execute(text("select count(*) from showing")).scalar()
                  alerted = c.execute(
                      text("select count(*) from film_state where alerted_new_at is not null")
                  ).scalar()
                  rev = c.execute(text("select version_num from alembic_version")).scalar()
              note(f"CONNECTED in {time.time()-t:.1f}s films={films} showings={showings} alerted={alerted} rev={rev}")
          except Exception as e:
              note(f"CONNECT FAILED {type(e).__name__}: {str(e)[:250]}")
              raise SystemExit(1)

          # a transaction pooler can break psycopg's prepared statements, which kick in
          # after the same query has run a few times. exercise that path deliberately.
          try:
              f = make_session_factory(eng)
              t = time.time()
              for i in range(12):
                  with f() as db:
                      db.execute(text("select count(*) from showing where show_date > :d"), {"d": "2026-01-01"}).scalar()
                      db.commit()
              note(f"12 REPEATED PARAMETERIZED QUERIES OK in {time.time()-t:.1f}s")
          except Exception as e:
              note(f"PREPARED STATEMENT PATH FAILED {type(e).__name__}: {str(e)[:250]}")
              raise SystemExit(1)
          PY
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          TMDB_API_KEY: "${{ secrets.TMDB_API_KEY }}"
      - name: alembic agrees the schema is current
        if: always()
        run: uv run alembic current
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          TMDB_API_KEY: "${{ secrets.TMDB_API_KEY }}"
